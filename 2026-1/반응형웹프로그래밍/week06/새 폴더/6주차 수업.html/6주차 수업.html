<!DOCTYPE html>
<html lang="ko">
<head>
    <style>
        ul {
            list-style: none;
            text-align: center;
            border-top: 1px solid red;
            border-bottom: 1px solid red;
            padding: 10px ();
        }

        ul li {
            display: inline;
            text-transform: uppercase;
            padding: 0 10px;
            letter-spacing: 10px;
        }

        ul li a {
            text-decoration: none;
            color: black;
        }

        ul li a:hover {
            text-decoration: underline;
        }
    </style>
</head>

    </ul>
</body>
</html>
